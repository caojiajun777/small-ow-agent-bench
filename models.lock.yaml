# Frozen compact-shell Core roster: 12 open-weight models (3B dense → 35B-A3B MoE).
# All 12 enter Base / five-skill / IRT-core. Hard-Release examinees are the 6
# with hard_release: true (Base-47 Atomic 47-mean ≥ 0.40, plus 27B and 35B).
# Skipped models are not scored as Hard zeros. Escape hatch: --hard-release --group all.
# --group main still selects the original 10 compact_dense models (Base-47 k=3 reuse).
# Batch is execution order only. Do not swap IDs after protocol check starts.
# Catalog check: 2026-08-25 (Beijing). 35B provider pin confirmed at protocol smoke.
# 10 compact Base-47 k=3 (reuse jobs/locked-core-k3.json; do not overwrite):
#   python scripts/run_locked.py --run --full --group main
# 35B protocol only (this step):
#   python scripts/run_locked.py --run --protocol --group moe
# k=3 fill attempts 2–3 still do not overwrite jobs/locked-core.json.

frozen: true
frozen_at: "2026-08-25"
catalog_checked_at: "2026-08-25T16:44:00+08:00"
archive_tag: benchmark-v0.1-base
archive_note: >
  10 compact_dense × Base-47 k=3 in jobs/locked-core-k3.json is the reusable
  Base component. Do not relabel those items as new Hard. Do not overwrite
  locked-core.json. Full 12-model Base+Hard is benchmark-v1.0-rc1 (not this tag).
substitution_policy: forbidden
scope: >
  Atomic capability gradient for compact open-weight coding agents from 3B
  dense to 35B-A3B MoE, under compact-shell. Not a parameter scaling law:
  35B-A3B is MoE (~3B active) and need not beat 27B dense.
harness:
  agent: agents.compact_shell:CompactShellAgent
  agent_version: "0.1.1"
  max_turns: 20
  observation_limit: 8000
  environment: novita
  k: 1
  n_concurrent: 1
  retry_include:
    - BuildException
    - EnvironmentStartTimeoutError
    - RateLimitException
  retry_note: infra/network only; never change provider on retry
inference:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 4096
  timeout_sec: 180
  thinking: off
  openrouter_provider:
    allow_fallbacks: false
    require_parameters: true
  note: >
    OpenRouter extra_body.provider.order is pinned per model.
    allow_fallbacks=false so BF16/FP8/INT4 cannot silently swap.
    Qwen3 / Qwen3.5 / Qwen3.8 / Qwen3.6 use reasoning.enabled=false and
    enable_thinking=false. thinking-on is not a second subject.
protocol_check:
  purpose: compact-shell bash/finish loop only; ignore MAIN_47 scores
  tasks:
    - hello-world
    - collect-todos
  pass_rule: atomic_correct=1 and termination=clean
  fail_rule: keep the model in the lock; record protocol_fail; do not replace
core:
  tasks: MAIN_47
  n_models: 12
  n_compact: 10
  n_upper: 1
  n_moe: 1
  n_protocol_trials: 24
  n_core_trials: 564
  n_trials_total: 588
  note: >
    k=1 census. Published Base uses k=3. The original 10 compact_dense
    Base-47 k=3 is reused from jobs/locked-core-k3.json.
irt:
  main: compact_dense
  n_main: 10
  core: all-12
  n_core: 12
  rulers_excluded_from_theta: false
  note: >
    Exploratory 1PL. --group main still fits the original 10.
    --group core fits all 12. Always run a no-MoE sensitivity.
    Report item×model matrix, not a precise theta.
hard_release:
  n_examinees: 6
  n_trials: 270
  rule: >
    Administer Hard-15 only if Base-47 Atomic 47-mean ≥ 0.40, plus the 27B
    dense and 35B-A3B MoE bands. Floor / Medium-struggle models stay on the
    Base table. Do not impute Hard p=0 for skipped IDs.
  skipped_not_scored_as_zero: true
  escape_hatch: "--hard-release --group all"
dropped_not_on_openrouter_or_out_of_band:
  - Qwen3.5-4B
  - Qwen3-4B
  - Qwen2.5-Coder-7B-Instruct
  - Seed-Coder-8B-Instruct
  - Nemotron-3-Nano-4B
  - Granite-4.1-3B
  - Gemma-4-E4B-IT
  - Gemma-4-12B-IT
  - Llama-3.1-8B-Instruct
  - Devstral-Small-2
  - Qwen3.6-27B
  - Qwen3-Coder-30B-A3B
  - Gemma-4-26B-A4B
  - Nemotron-3-Nano-30B-A3B
  - gpt-oss-20B
  - Nemotron-Nano-9B-V2-Free

