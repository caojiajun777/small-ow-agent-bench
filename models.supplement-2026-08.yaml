# Frozen four-model supplement to benchmark-v1.0.1.
#
# This is a later v1.0.1 administration. It does not modify models.lock.yaml
# or any frozen source result. Its rows enter the v1.0.1 canonical matrix as
# an append-only supplement layer, with the documented gpt-oss mandatory-
# reasoning exception below.

frozen: true
kind: supplement_2026_08
benchmark_version: benchmark-v1.0.1-supplement-2026-08
frozen_at: "2026-08-28T03:12:30+08:00"
catalog_checked_at: "2026-08-28T02:50:50+08:00"
substitution_policy: forbidden
overwrites_v1: false
enters_v1_0_1_canonical: true

harness:
  agent: agents.compact_shell:CompactShellAgent
  agent_version: "0.1.1+supplement3"
  agent_kwargs:
    version_label: "0.1.1+supplement3"
    protocol_clarification: >
      In the bash example, <command> names the place where raw shell text goes.
      Never output literal <command> or </command> tags. Emit only the raw shell
      command between the bash fences, and stop the response after that one fence.
  max_turns: 20
  observation_limit: 8000
  environment: novita
  n_concurrent: 1
  k: 3
  retry_include:
    - BuildException
    - EnvironmentStartTimeoutError
    - RateLimitException
    - RateLimitError
    - ConnectError
    - APIConnectionError
    - ServiceUnavailableError
    - AuthenticationError

inference:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 4096
  timeout_sec: 180
  provider:
    allow_fallbacks: false
    require_parameters: true
  reasoning_policy: >
    Reasoning is disabled and excluded where the model permits it. OpenRouter
    declares gpt-oss-20b reasoning mandatory, so that model is pinned to low
    effort. Its reasoning field is retained because the Novita Harmony route
    intermittently returns an empty final field when reasoning is excluded;
    CompactShell still parses only the separate final content field. This is a
    declared protocol exception, not an off-thinking result.

scope:
  protocol_tasks:
    - hello-world
    - collect-todos
    - loc-member-discount
  n_protocol_trials: 12
  formal_tasks: MAIN_47 + HARD_RELEASE_15
  n_formal_tasks: 62
  attempts:
    - 1
    - 2
    - 3
  n_models: 4
  n_formal_trials: 744

protocol_adaptations:
  parser_changed: false
  common_prompt_clarification: >
    The literal <command> placeholder is explicitly forbidden in output. This
    keeps the bash/finish grammar unchanged and prevents template echoing.
  gemma_single_action_stops:
    - "\n\nWait"
    - "\n\nActually"
    - "\n\nLet's"
    - "\n\nI "
    - "\n\nWe "
  gemma_stop_note: >
    Gemma 4 otherwise emits several action fences while visibly revising its
    first action until max_tokens. The stop markers cut only those post-fence
    self-correction prefixes. The first closed action fence remains intact.
  gpt_oss_provider_note: >
    DeepInfra BF16 passed single calls but repeatedly rate-limited later turns
    in Harbor. CoreWeave and Parasail returned Harmony reasoning with empty
    visible content on the complex probe. Novita FP4 is the frozen route.
    Retaining its separate reasoning field avoids intermittent empty final
    content observed when OpenRouter was asked to exclude that field; the
    action parser still consumes final content only.

