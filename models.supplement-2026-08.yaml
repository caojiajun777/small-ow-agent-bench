        IMPORTANT FOR HARMONY MODE: there are no JSON tools. Never emit a
        {"cmd": ...} object in analysis or reasoning. Put the next raw shell
        command in a bash fence in the visible final answer on every turn;
        never leave final content empty.
    llm_call_kwargs:
